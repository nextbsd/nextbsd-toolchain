name: Build Toolchain Containers
on:
  repository_dispatch:
    types: [upstream-updated]
  workflow_dispatch:
  pull_request:
    # Validate the container build on PRs that touch it. PR runs build-only
    # (no push, see below) and never cascade downstream — the dispatch steps
    # are gated on github.ref_name == 'main', which is "<PR#>/merge" on a PR.
    paths:
      - 'Dockerfile.*'
      - 'llvm/**'
      - 'mesa-clc/**'
      - '.github/workflows/build-toolchain.yml'
  schedule:
    - cron: '0 6 * * 1'  # weekly fallback

env:
  REGISTRY: ghcr.io
  # The image is moving to the repo's name (#15). Stage 1: every image is
  # pushed under both names; consumers still pull IMAGE until stage 2 switches
  # them to IMAGE_NEW, then IMAGE stops being pushed.
  IMAGE: ghcr.io/nextbsd/nextbsd-kernel-toolchain
  IMAGE_NEW: ghcr.io/nextbsd/nextbsd-toolchain
  FREEBSD_BRANCH: releng/15.1

jobs:
  # clang/lld 19.1.7 from pinned upstream source (the "llvm" stage, identical in
  # both Dockerfiles). A from-source LLVM build takes far longer than the rest
  # of the image, so it runs ONCE here, for both arches (the compiler is an
  # x86_64 host binary either way), and lands only in the GitHub Actions cache:
  # nothing is pushed. The cache key is BuildKit's own content hash of the
  # stage (pinned base digest + llvm/ files), so a run with an unchanged pin is
  # a cache hit and finishes in a minute or two; changing llvm/source.env or
  # the recipe rebuilds it. On a PR the cache is written to the PR's own scope,
  # never to main's.
  llvm:
    name: clang/lld (llvmorg-19.1.7, cached)
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the llvm stage into the cache
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.amd64
          target: llvm
          push: false
          outputs: type=cacheonly
          cache-from: type=gha,scope=nextbsd-llvm
          cache-to: type=gha,scope=nextbsd-llvm,mode=max

  # Host libraries for Mesa's mesa_clc (nextbsd-toolchain#11): LLVM/clang
  # 19.1.7 shared, SPIRV-LLVM-Translator, SPIRV-Tools (the "mesa-clc-llvm" and
  # "mesa-clc" stages, identical in both Dockerfiles; see mesa-clc/README.md).
  # Like the llvm job: built once, kept only in the GitHub Actions cache under
  # its own scope (so the llvm cache is untouched), nothing pushed; a PR's
  # cache stays in the PR's scope. The LLVM stage is built and cached first,
  # so a failure or change in the SPIR-V half does not rebuild LLVM.
  mesa-clc:
    name: mesa_clc host libraries (LLVM 19.1.7 + SPIR-V, cached)
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the mesa-clc-llvm stage into the cache
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.amd64
          target: mesa-clc-llvm
          push: false
          outputs: type=cacheonly
          cache-from: |
            type=gha,scope=nextbsd-mesa-clc
            type=gha,scope=nextbsd-llvm
          cache-to: type=gha,scope=nextbsd-mesa-clc,mode=max

      - name: Build the mesa-clc stage into the cache
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.amd64
          target: mesa-clc
          push: false
          outputs: type=cacheonly
          cache-from: type=gha,scope=nextbsd-mesa-clc
          cache-to: type=gha,scope=nextbsd-mesa-clc,mode=max

  build:
    runs-on: ubuntu-24.04
    needs: [llvm, mesa-clc]
    outputs:
      # #423: promoted so the notify job below can forward it -- steps.*.outputs
      # is not reachable across jobs.
      sha: ${{ steps.src.outputs.sha }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: amd64
            target_arch: amd64
          - target: arm64
            target_arch: aarch64
    permissions:
      packages: write

    steps:
      - uses: actions/checkout@v4

      # gha cache export needs the docker-container driver (the default docker
      # driver can't export cache).
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve image tags
        id: src
        run: |
          SHA="${{ github.event.client_payload.sha }}"
          # On pull_request, github.ref_name is "<PR#>/merge"; use the source
          # branch (head_ref) and replace "/" so the computed image tag stays a
          # valid Docker reference even though PR builds don't push it.
          BRANCH="${{ github.head_ref || github.ref_name }}"
          BRANCH="${BRANCH//\//-}"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          # image_tag = the tag downstream jobs should pull.
          if [ "$BRANCH" = "main" ]; then
            echo "image_tag=${{ matrix.target }}-fbsd-${SHA:-tip}" >> "$GITHUB_OUTPUT"
          else
            echo "image_tag=${{ matrix.target }}-${BRANCH}" >> "$GITHUB_OUTPUT"
          fi
          # Tag list to push: BRANCH builds publish ONLY a branch-scoped tag and
          # never touch production; only main publishes :latest + :fbsd-<sha>.
          {
            echo "tags<<EOF"
            for img in "${{ env.IMAGE }}" "${{ env.IMAGE_NEW }}"; do
              echo "${img}:${{ matrix.target }}-${BRANCH}"
              if [ "$BRANCH" = "main" ]; then
                echo "${img}:${{ matrix.target }}-latest"
                echo "${img}:${{ matrix.target }}-fbsd-${SHA:-tip}"
              fi
            done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.${{ matrix.target }}
          # Never publish from a PR — build only, to validate the Dockerfile.
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            TARGET=${{ matrix.target }}
            TARGET_ARCH=${{ matrix.target_arch }}
            FREEBSD_BRANCH=${{ env.FREEBSD_BRANCH }}
            FREEBSD_SHA=${{ github.event.client_payload.sha }}
          tags: ${{ steps.src.outputs.tags }}
          # Only the "llvm" stage (pinned clang/lld, built by the llvm job
          # above) and the "mesa-clc" stages (the mesa-clc job) come from the
          # cache. The "toolchain" stage -- apt deps,
          # /usr/src at FREEBSD_SHA, kernel-toolchain -- is never cached: every
          # image is built from scratch off the current FREEBSD_SHA source, so
          # a stale layer can never pin an old base version.
          cache-from: |
            type=gha,scope=nextbsd-llvm
            type=gha,scope=nextbsd-mesa-clc
          no-cache-filters: toolchain

  # #423: the downstream dispatch used to fire from INSIDE the build matrix,
  # off the amd64 leg only -- the moment amd64 pushed, the downstream arm64
  # jobs started pulling arm64-fbsd-<sha>, which arm64 (it trails amd64 by
  # ~40-60s) had not pushed yet. The pull retries (1.6s/6.5s/9.9s backoff,
  # ~19s total) gave up ~30s before the tag landed: `manifest unknown`, and on
  # 2026-08-26 the whole nightly chain stalled (kernel + compat arm64 legs
  # failed, both publishes skipped). A `needs: build` job waits for ALL matrix
  # legs (fail-fast: false, so a failed leg still fails `build` and correctly
  # blocks the cascade rather than dispatching against a missing tag) and fans
  # out only then. Same firing conditions as before (main, non-PR), so a
  # branch/PR build still never cascades.
  notify:
    name: notify downstream (both toolchain images pushed)
    runs-on: ubuntu-24.04
    needs: build
    if: github.ref_name == 'main' && github.event_name != 'pull_request'
    steps:
      # nextbsd-kernel reads client_payload.fbsd_sha to pin its toolchain
      # image tag; the PAT stays only on this step.
      - name: Trigger downstream kernel build
        run: |
          gh api repos/nextbsd/nextbsd-kernel/dispatches \
            -f event_type=toolchain-updated \
            -f "client_payload[fbsd_sha]=${{ needs.build.outputs.sha }}"
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
      # nextbsd-freebsd-compat consumes the SAME toolchain image as the kernel
      # build (it cross-builds the from-source base with it), so it must
      # rebuild whenever the toolchain/freebsd-src changes.
      - name: Trigger downstream base (compat) build
        run: |
          gh api repos/nextbsd/nextbsd-freebsd-compat/dispatches \
            -f event_type=toolchain-updated \
            -f "client_payload[fbsd_sha]=${{ needs.build.outputs.sha }}"
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
